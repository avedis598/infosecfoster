apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: aml-lab
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: OpenSearch
      uid: OpenSearch
      type: grafana-opensearch-datasource
      url: http://opensearch.aml-lab.svc.cluster.local:9200
      access: proxy
      jsonData:
        database: "[wazuh-alerts-4.x-]YYYY.MM.DD"
        timeField: "timestamp"
        version: "2.13.0"
    - name: SIEM-Telemetry
      uid: SIEM-Telemetry
      type: grafana-opensearch-datasource
      url: http://opensearch.aml-lab.svc.cluster.local:9200
      access: proxy
      jsonData:
        database: "siem-telemetry"
        timeField: "timestamp"
        version: "2.13.0"
    - name: TheHive
      uid: TheHive
      type: yesoreyeram-infinity-datasource
      url: http://thehive.aml-lab.svc.cluster.local:9000/api/v1
      access: proxy
      secureJsonData:
        httpHeaderValue1: "Bearer ${THEHIVE_API_KEY}"
      jsonData:
        httpHeaderName1: "Authorization"
        global_queries: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: aml-lab
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
